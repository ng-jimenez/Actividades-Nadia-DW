<!-- Este desarrollo vamos a diseñar una tarjeta interactiva de Navidad-->
 <!--Nombre: Nadia Barberi-->
 <!--Actividad 1-->

 <!DOCTYPE html> <!--Esta etiqueta declara el tipo de documento-->
 <html lang="es">
<head>
    <!--El título de la página no es visible en el desarrollo pero es lo que funciona para el SEO-->
<title> Tarjeta de Navidad | Personalizados </title>
<!--En la etiqueta head va todo lo que no es visible en la página web pero la hace funcional-->
<!--A continuación los metadatos para que la página reconozca, caractéres especiales, 
y se adapte a diferentes dispositivos-->
<meta charset="UTF-8"> <!--Este metadato es para los caracteres especiales-->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Tarjeta de Navidad interactiva con diseño personalizado">
<meta name="author" content="Nadia Barberi">

<script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

<link rel="stylesheet" href="styles.css">
</head> <!--HASTA AQUÍ VA EL HEAD-->

<!--AQUÍ INICIA EL BODY-->
<body>
    <div class="main-container">
   <!-- Cover -->
   <div class="page active" id="page-0">
    <div class="float-container">
     <img src="navidad.jpg" alt="Merry Christmas" class="cover-img">
    </div>
    <h1 class="cover-title">Feliz Navidad 2026 🎄 </h1>
    <p class="cover-subtitle">Con todo mi cariño, ¡Felices Fiestas! </p>
    <button id="btn-enter" class="btn-primary">
      <span class="btn-text">🎅 </span>
    </button>
   </div>

<!--Mensaje página 1-->
<div class="page" id="pagina1">
    <div class="photo-circle">
      <img class="photo-img" loading="lazy" src="navidad 2.jpg" alt="Casas Navideñas">
    </div>
    <p class="msg-text">Te deseo lo mejor en esta Navidad, que esté llena de magia y amor 🎄🎁</p>
    <button id="btn-next-1" class="btn-secondary">
      <span class="btn-text">Siguiente</span>
    </button>
   </div>

<!--Mensaje página 2-->
<div class="page" id="pagina2">
    <h2 class="gallery-title">Con mucho amor ✨</h2>
    <div class="gallery-grid">
     <div class="gallery-item gold-border">
      <img class="gallery-img" loading="lazy" src="snowman.jpg" alt="Muñeco de nieve">
     </div>
     <div class="gallery-item gold-border">
      <img class="gallery-img" loading="lazy" src="galletas.jpg" alt="Galleta navideña">
     </div>
     <div class="gallery-item gold-border">
      <img class="gallery-img" loading="lazy" src="nieve.jpg" alt="Villa nevada">
     </div>
    </div>
  
    <p class="gallery-caption">Feliz Navidad y feliz Año Nuevo. Espero que disfrutes mucho estas fechas y que el próximo año esté lleno de cosas bonitas para ti. Te amo mucho ❤️✨</p>
   </div>

<script src="script.js"></script>
</body>
 </html>
